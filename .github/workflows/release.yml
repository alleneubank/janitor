name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - zig-target: x86_64-linux
            artifact: linux-x86_64
          - zig-target: aarch64-linux
            artifact: linux-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2

      - name: Build archive
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          ZIG_TARGET: ${{ matrix.zig-target }}
          ARTIFACT_TARGET: ${{ matrix.artifact }}
        run: |
          set -eu
          version="$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | sed -n '1p')"
          [ "$RELEASE_TAG" = "v$version" ] || {
            echo "release tag $RELEASE_TAG does not match package version v$version" >&2
            exit 1
          }
          archive_base="janitor-${version}-${ARTIFACT_TARGET}"
          # Computed with the runner's git so
          # the embedded `janitor --version` sha is always real, never "unknown".
          git_sha="$(git rev-parse --short HEAD)"

          zig build -Doptimize=ReleaseSafe -Dtarget="$ZIG_TARGET" -Dgit_sha="$git_sha"

          mkdir -p "dist/$archive_base"
          cp zig-out/bin/janitor "dist/$archive_base/janitor"
          cp README.md LICENSE "dist/$archive_base/"
          tar -C dist -czf "dist/$archive_base.tar.gz" "$archive_base"
          shasum -a 256 "dist/$archive_base.tar.gz" >"dist/$archive_base.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: janitor-${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.artifact }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - zig-target: aarch64-macos
            artifact: macos-arm64
          - zig-target: x86_64-macos
            artifact: macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2

      - name: Build and verify archive
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          ZIG_TARGET: ${{ matrix.zig-target }}
        run: |
          set -eu
          # Computed with the runner's git so
          # the embedded `janitor --version` sha is always real, never "unknown".
          RELEASE_GIT_SHA="$(git rev-parse --short HEAD)"
          export RELEASE_GIT_SHA
          scripts/release-macos.sh \
            --target "$ZIG_TARGET" \
            --dist-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: janitor-${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  draft-release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs:
      - linux
      - macos
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          notes="Prebuilt janitor release archives are attached for Linux and macOS. macOS archives carry credential-free ad-hoc signatures verified after archive extraction. SHA-256 checksum files are included for package-manager installation."

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --draft \
              --title "$RELEASE_TAG" \
              --notes "$notes" \
              --repo "$GITHUB_REPOSITORY"
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --draft \
              --title "$RELEASE_TAG" \
              --notes "$notes" \
              --repo "$GITHUB_REPOSITORY"
          fi
